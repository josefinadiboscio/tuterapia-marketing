# Manual probe for the phase 0 checkpoint.
#
# Calls the cron endpoints with the bearer token so the result can be read
# from the Actions log, without needing a local terminal. The token lives in
# the CRON_SECRET repository secret and is masked by GitHub in the output.
#
# Temporary: delete once the queries are validated against Looker.
name: Probe cron endpoints

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL de produccion del dashboard
        required: true
        default: https://tuterapia-marketing.vercel.app
      paths:
        description: Rutas a consultar, separadas por espacios
        required: true
        default: /api/cron/sync /api/cron/schema /api/cron/profile

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
          BASE: ${{ inputs.base_url }}
          PATHS: ${{ inputs.paths }}
        run: |
          for path in $PATHS; do
            echo "===== $path ====="
            status=$(curl -sS -o body.txt -w '%{http_code}' \
              -H "Authorization: Bearer $SECRET" "${BASE%/}$path")
            echo "HTTP $status"
            jq . body.txt 2>/dev/null || cat body.txt
            echo
          done
